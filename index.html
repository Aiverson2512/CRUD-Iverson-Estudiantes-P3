<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Estudiantes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1>Registro de Estudiantes</h1>

    <form id="studentForm">
        <input type="hidden" id="studentIndex" value="-1">

        <input
            type="text"
            id="name"
            placeholder="Nombre"
            required>

        <input
            type="text"
            id="career"
            placeholder="Carrera"
            required>

        <button type="submit">
            Guardar
        </button>

    </form>

    <h2>Lista de Estudiantes</h2>

<table border="1">

    <thead>
        <tr>
            <th>Nombre</th>
            <th>Carrera</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody id="studentTable">

    </tbody>

</table>

    <script src="js/app.js"></script>

</body>
</html>
